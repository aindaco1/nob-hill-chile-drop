name = "nob-hill-chile-drop-api"
account_id = "fee6147787ab9025e9fd8e6e8fd76910"
main = "src/worker.js"
compatibility_date = "2026-10-27"
workers_dev = true

[build]
command = "node scripts/prepare-share.mjs"

[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = true

[vars]
# Retain the previous origin during the custom-domain transition.
ALLOWED_ORIGINS = "https://chiledrop.com,https://www.chiledrop.com,https://aindaco1.github.io"
PUBLIC_SITE_URL = "https://chiledrop.com"
ADMIN_EMAILS = "alonso@dustwave.xyz"
REPORT_EMAIL = "alonso@dustwave.xyz"
EMAIL_FROM = "Nob Hill Chile Drop <events@dustwave.xyz>"

[[d1_databases]]
binding = "DB"
database_name = "nob-hill-chile-drop"
database_id = "7afb3b21-843c-4967-bda4-edc5272e9a3c"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *", "0 16 * * MON"]

# Secrets: RESEND_API_KEY, OUTBOX_ENCRYPTION_KEY, TICKET_SIGNING_KEY (independent 32-byte base64url keys).
# Keep credentials out of this file and the GitHub Pages build.

# SUPER_ADMIN_EMAILS is privately provisioned as a secret. Database admins use admin_access.
