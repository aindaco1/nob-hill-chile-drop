faq:
  - question: When does the chile drop?
    answer: The chile drops at midnight Mountain Time as December 31, 2026 becomes January 1, 2027. The full evening schedule will be announced here.
  - question: Where is the event?
    answer: At Hotel Zazz in Nob Hill, Albuquerque, New Mexico. Public viewing points and the entrance map are coming soon.
  - question: What is the Hot Spot?
    answer: The Hot Spot is the controlled-access area close to the chile and the music. Enter the free drawing for a chance at admission for your whole group. Drinks and other purchases are separate.
  - question: Can I watch without Hot Spot access?
    answer: Yes. People outside the controlled-access area can watch from public vantage points. We'll share the confirmed viewing map before the event.
  - question: Can my family or group stay together?
    answer: Yes. Enter once for your whole group, including yourself. Groups are selected together; nobody in a selected group is split off to fill the remaining space. There is one group entry per email address.
  - question: How does the free drawing work?
    answer: Confirm your email to make your group entry eligible. Each verified group entry gets one place in a random order, regardless of group size. Groups are selected in that order up to the 2,000-person capacity. Selection stops when the next whole group won't fit; that group and all later groups remain on the waitlist. There is no payment to enter or to receive selected admission.
  - question: When will I hear about the drawing?
    answer: The drawing date is still to be announced. After organizers close entries and review the drawing, selected groups will be notified by email. Every group can use its private entry link to check the result.
  - question: Is there a livestream?
    answer: Coverage is being planned. The viewing link and confirmed broadcast schedule will appear here when they're ready.
