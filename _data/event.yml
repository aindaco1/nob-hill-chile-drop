faq:
  - question: When does the chile drop?
    answer: The chile drops at midnight Mountain Time as December 31, 2026 becomes January 1, 2027. The Hot Spot opens at 10 p.m., and alcohol sales stop at 11:30 p.m.
  - question: How does the free drawing work?
    answer: Enter your group and confirm your email. Each verified group gets one place in a random order, regardless of group size. We select whole groups in that order, up to 2,000 people. When the next group won't fit, selection stops and the remaining groups stay on the waitlist. There's one group entry per email address, and no charge for entry or selected admission.
  - question: When will I hear about the drawing?
    answer: We haven't set a drawing date yet. Once entries close and the results are reviewed, we'll email selected groups. You can also check your result using the private link in your entry email.
